<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CPU Scheduling Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>CPU Scheduling</h1>

  <!-- ===================== INPUT PANEL ===================== -->
  <div class="panel">
    <h2>Input Processes</h2>

    <div class="row">
      <div>
        <label for="numProcesses">Number of Processes (n)</label>
        <input type="number" id="numProcesses" min="1" max="10" placeholder="0">
      </div>
      <div>
        <label for="quantum">Time Quantum (for Round Robin)</label>
        <input type="number" id="quantum" min="1" placeholder="0">
      </div>
    </div>

    <label style="margin-top:18px;">Process Details</label>

    <table class="input-table">
      <thead>
        <tr>
          <th>Process</th>
          <th>Arrival Time</th>
          <th>Burst Time</th>
          <th>Priority</th>
        </tr>
      </thead>
      <tbody id="inputBody">
        <!-- filled by JS -->
      </tbody>
    </table>

    <button onclick="runAll()">Solve</button>
    <button class="secondary" onclick="loadSample()">Load Sample</button>
    <button class="secondary" onclick="clearAll()">Clear</button>

    <div id="errBox" class="err"></div>
  </div>

  <!-- ===================== FCFS (PATRICK) ===================== -->
  <div class="panel">
    <h2>First-Come, First-Served (FCFS)</h2>
    <div id="fcfsOutput">
      <div class="placeholder">Solve to see results.</div>
    </div>
  </div>

  <!-- ===================== SJF (PATRICK) ===================== -->
  <div class="panel">
    <h2>Shortest Job First (SJF, Non-Preemptive)</h2>
    <div id="sjfOutput">
      <div class="placeholder">Solve to see results.</div>
    </div>
  </div>

  <!-- ===================== PRIORITY ===================== -->
  <div class="panel">
    <h2>Priority Scheduling (Non-Preemptive)</h2>
    <div id="priorityOutput">
      <div class="placeholder">Solve to see results.</div>
    </div>
  </div>

  <!-- ===================== ROUND ROBIN ===================== -->
  <div class="panel">
    <h2>Round Robin</h2>
    <div id="rrOutput">
      <div class="placeholder">Solve to see results.</div>
    </div>
  </div>

</div>

<script src="script.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', buildInputTable);
</script>

</body>
</html>
